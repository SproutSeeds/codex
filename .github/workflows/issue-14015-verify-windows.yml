name: issue-14015-verify-windows

on:
  workflow_dispatch:
  push:
    branches:
      - sprout/issue-14015-windows-handoff

jobs:
  build-windows-binaries:
    name: Build Windows verification binaries
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target x86_64-pc-windows-msvc \
            --bin codex \
            --bin codex-responses-api-proxy \
            --bin codex-windows-sandbox-setup \
            --bin codex-command-runner

      - name: Stage Windows binaries
        shell: bash
        run: |
          output_dir="target/x86_64-pc-windows-msvc/debug/staged-issue-14015"
          mkdir -p "$output_dir"
          cp target/x86_64-pc-windows-msvc/debug/codex.exe "$output_dir/codex.exe"
          cp target/x86_64-pc-windows-msvc/debug/codex-responses-api-proxy.exe "$output_dir/codex-responses-api-proxy.exe"
          cp target/x86_64-pc-windows-msvc/debug/codex-windows-sandbox-setup.exe "$output_dir/codex-windows-sandbox-setup.exe"
          cp target/x86_64-pc-windows-msvc/debug/codex-command-runner.exe "$output_dir/codex-command-runner.exe"

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v7
        with:
          name: issue-14015-windows-binaries-x86_64-pc-windows-msvc-debug
          path: codex-rs/target/x86_64-pc-windows-msvc/debug/staged-issue-14015/*
